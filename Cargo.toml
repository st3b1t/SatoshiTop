[package]
name = "satoshitop"
version = "3.0.0"
edition = "2024"
rust-version = "1.88"
description = "Bitcoin full node monitoring dashboard for terminal (Rust port of SatoshiTop)"
authors = ["st3b1t"]
license = "MIT"
readme = "README.md"
keywords = ["bitcoin", "dashboard", "fullnode", "monitoring", "top"]

[[bin]]
name = "satop"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
malevich =  { version = "1.25", features = ["ratatui"] } 
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
rust-ini = "0.21.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time", "net", "io-util"] }
