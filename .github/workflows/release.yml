name: Release binary

on:
  # Every version tag: v3.0.0, v3.0.1, v3.1.0-alpha.1, ...
  push:
    tags:
      - 'v*'

permissions:
  # Upload the archive to the release.
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust with the musl target
        run: |
          rustup toolchain install 1.88 --profile minimal --target x86_64-unknown-linux-musl
          rustup default 1.88
      # A static binary runs on any x86_64 Linux, whatever its glibc.
      - name: Build
        run: cargo build --locked --release --target x86_64-unknown-linux-musl
      - name: Package
        run: |
          name="satop-${GITHUB_REF_NAME}-x86_64-linux-musl"
          mkdir "$name"
          cp target/x86_64-unknown-linux-musl/release/satop LICENSE README.md "$name/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a suffix (v3.1.0-alpha.1) is a pre-release, never "Latest".
          pre=; case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; esac
          # The other build workflow may have created it already.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes $pre \
            || gh release view "$GITHUB_REF_NAME" >/dev/null
          gh release upload "$GITHUB_REF_NAME" --clobber satop-*.tar.gz satop-*.tar.gz.sha256
