# Builds satop for each supported distribution from the same sources and the
# same Cargo.toml:
# - x86-64: inside a container of the distribution itself, so the binary is
#   linked against its glibc and runs there and on newer releases;
# - Raspberry Pi OS 64 bit: cross-compiled with cross, whose container has an
#   older glibc than any Raspberry Pi OS release that supports arm64.
name: Build binaries

on:
  # Every version tag: v3.0.0, v3.0.1, v3.1.0-alpha.1, ...
  push:
    tags:
      - 'v*'

env:
  RUST_VERSION: '1.88'

jobs:
  x86-64:
    name: satop-${{ matrix.platform }}-x86-64
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: debian-13
            image: debian:13
          - platform: debian-12
            image: debian:12
          - platform: ubuntu-24.04
            image: ubuntu:24.04
          - platform: ubuntu-22.04
            image: ubuntu:22.04
    env:
      ARTIFACT: satop-${{ matrix.platform }}-x86-64
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl
      - uses: actions/checkout@v4
      # Distribution packages of Rust are older than the minimum version.
      - name: Install Rust ${{ env.RUST_VERSION }}
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain "$RUST_VERSION"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build
        run: cargo build --locked --release
      - name: Check the binary
        run: |
          target/release/satop -V
          echo "glibc of the build system: $(ldd --version | head -1)"
          echo "newest glibc symbol required:"
          objdump -T target/release/satop | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
      - name: Package
        run: |
          mkdir "$ARTIFACT"
          cp target/release/satop LICENSE README.md "$ARTIFACT/"
          # A tar archive keeps the executable bit, which artifacts drop.
          tar czf "$ARTIFACT.tar.gz" "$ARTIFACT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.ARTIFACT }}.tar.gz
          if-no-files-found: error

  raspios-arm64:
    name: satop-raspios-64-arm64
    runs-on: ubuntu-latest
    env:
      ARTIFACT: satop-raspios-64-arm64
      TARGET: aarch64-unknown-linux-gnu
      CROSS_VERSION: v0.2.5
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target "$TARGET"
          rustup default "$RUST_VERSION"
      # Prebuilt cross; it runs the build in its Docker image for the target.
      - name: Install cross
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL \
            "https://github.com/cross-rs/cross/releases/download/$CROSS_VERSION/cross-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz -C "$HOME/.cargo/bin" cross
          cross --version
      - name: Build
        run: cross build --locked --release --target "$TARGET"
      - name: Check the binary
        run: |
          file "target/$TARGET/release/satop"
          echo "newest glibc symbol required:"
          objdump -T "target/$TARGET/release/satop" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
      - name: Package
        run: |
          mkdir "$ARTIFACT"
          cp "target/$TARGET/release/satop" LICENSE README.md "$ARTIFACT/"
          tar czf "$ARTIFACT.tar.gz" "$ARTIFACT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.ARTIFACT }}.tar.gz
          if-no-files-found: error

  # Attaches the five archives, each with its .sha256, to the release of the tag.
  release:
    needs: [x86-64, raspios-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: satop-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: for f in *.tar.gz; do sha256sum "$f" > "$f.sha256"; done
      - name: Upload to the release
        working-directory: dist
        run: |
          # A tag with a suffix (v3.1.0-alpha.1) is a pre-release, never "Latest".
          pre=; case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; esac
          # The other build workflow may have created it already.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes $pre \
            || gh release view "$GITHUB_REF_NAME" >/dev/null
          gh release upload "$GITHUB_REF_NAME" --clobber satop-*.tar.gz satop-*.tar.gz.sha256
