# Disabled: GitHub only runs workflows in .github/workflows/.
# Rename the directory to enable it.
name: Release binary

on:
  release:
    types: [created]

permissions:
  # Upload the archive to the release.
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust with the musl target
        run: |
          rustup toolchain install 1.88 --profile minimal --target x86_64-unknown-linux-musl
          rustup default 1.88
      # A static binary runs on any x86_64 Linux, whatever its glibc.
      - name: Build
        run: cargo build --locked --release --target x86_64-unknown-linux-musl
      - name: Package
        run: |
          name="satop-${GITHUB_REF_NAME}-x86_64-linux-musl"
          mkdir "$name"
          cp target/x86_64-unknown-linux-musl/release/satop LICENSE README.md "$name/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" satop-*.tar.gz satop-*.tar.gz.sha256
